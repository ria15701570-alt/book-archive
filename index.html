<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 책 보관함</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❤️</text></svg>">
<meta property="og:title" content="My Book Archive">
<meta property="og:description" content="독서 기록 by 원쥬르">
<meta property="og:image" content="https://ria15701570-alt.github.io/book-archive/og-image.png">
<meta property="og:url" content="https://ria15701570-alt.github.io/book-archive/">
<meta property="og:type" content="website">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --green-dark:   #1a3a2a;
  --green-main:   #2d5a3d;
  --green-mid:    #3d7a52;
  --green-light:  #e8f2ec;
  --green-pale:   #f3f8f5;
  --white:        #ffffff;
  --text-primary: #1a1a1a;
  --text-secondary: #4a4a4a;
  --text-muted:   #8a8a8a;
  --border:       #e2e8e4;
  --border-hover: #b8cfc0;
  --bg:           #f7f9f7;
}

body {
  font-family: 'Noto Sans KR', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  min-height: 100vh;
}

.hero {
  background: var(--green-main);
  padding: 1.75rem 2.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  flex-wrap: wrap;
}

.hero-left { display: flex; align-items: center; gap: 1.25rem; }

.hero-eyebrow {
  font-size: 0.7rem;
  color: rgba(255,255,255,0.5);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 2px;
}

.hero-heading {
  font-family: 'Noto Serif KR', serif;
  font-size: 1.3rem;
  font-weight: 600;
  color: #fff;
}

.btn-add {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  background: rgba(255,255,255,0.15);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 4px;
  font-size: 1rem;
  font-weight: 400;
  cursor: pointer;
  transition: background 0.15s;
  font-family: inherit;
  line-height: 1;
  align-self: flex-end;
  margin-bottom: 2px;
}

.btn-add:hover { background: rgba(255,255,255,0.25); }

.hero-stats { display: flex; gap: 2rem; }

.hero-stat-num {
  font-family: 'Noto Serif KR', serif;
  font-size: 2rem;
  font-weight: 600;
  color: #fff;
  line-height: 1;
}

.hero-stat-unit {
  font-family: 'Noto Serif KR', serif;
  font-size: 1rem;
  color: rgba(255,255,255,0.85);
  margin-left: 2px;
}

.hero-stat-label {
  font-size: 0.72rem;
  color: rgba(255,255,255,0.5);
  margin-top: 4px;
}

main { max-width: 1200px; margin: 0 auto; padding: 2rem; }

.toolbar {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 1.75rem;
  flex-wrap: wrap;
}

.toolbar-row { flex: 1; min-width: 200px; display: flex; }

.sort-tabs { display: flex; gap: 16px; flex-shrink: 0; }

.sort-tab {
  font-size: 0.8rem;
  color: var(--text-muted);
  cursor: pointer;
  padding-bottom: 2px;
  border-bottom: 2px solid transparent;
  transition: all 0.15s;
}

.sort-tab:hover { color: var(--text-primary); }
.sort-tab.active { color: var(--text-primary); font-weight: 500; border-bottom-color: var(--text-primary); }

.search-wrap { position: relative; flex: 1; min-width: 200px; }

.search-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 13px;
  pointer-events: none;
}

.search-input {
  width: 100%;
  padding: 0.65rem 1rem 0.65rem 2.6rem;
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 0.875rem;
  background: var(--white);
  color: var(--text-primary);
  outline: none;
  transition: border-color 0.15s;
  font-family: inherit;
}

.search-input:focus { border-color: var(--green-mid); }
.search-input::placeholder { color: var(--text-muted); }

select.filter-select {
  padding: 0.65rem 1rem;
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 0.875rem;
  background: var(--white);
  color: var(--text-primary);
  outline: none;
  cursor: pointer;
  min-width: 110px;
  font-family: inherit;
}

.books-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
  gap: 18px;
}

.book-card {
  background: var(--white);
  border-radius: 10px;
  border: 1px solid var(--border);
  overflow: hidden;
  cursor: default;
  transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s;
  display: flex;
  flex-direction: column;
}

.book-card:hover {
  border-color: var(--border);
  box-shadow: none;
}

.book-card.has-fav:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 28px rgba(45,90,61,0.11);
  border-color: var(--border-hover);
}

.book-spine { height: 5px; flex-shrink: 0; background: #2d5a3d; }
.book-spine.has-fav { background: #9b4444; }

.book-cover {
  background: var(--green-pale);
  padding: 1rem 1.1rem 0.875rem;
  flex-shrink: 0;
  min-height: 65px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  position: relative;
}

.book-cover-icon {
  position: absolute;
  top: 0.9rem;
  right: 0.9rem;
  font-size: 1.4rem;
  opacity: 0.15;
}

.book-thumb {
  position: absolute;
  top: 0.65rem;
  right: 0.65rem;
  width: 30px;
  height: 42px;
  border-radius: 2px;
  background-size: cover;
  background-position: center;
  flex-shrink: 0;
}

.book-thumb.has-cover { box-shadow: 0 1px 4px rgba(26,58,42,0.25); }

.book-badge {
  display: inline-block;
  font-size: 0.62rem;
  padding: 2px 7px;
  border-radius: 20px;
  font-weight: 500;
  margin-bottom: 7px;
  width: fit-content;
  letter-spacing: 0.2px;
  background: var(--green-light);
  color: var(--green-dark);
}

.book-title {
  font-family: 'Noto Serif KR', serif;
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--text-primary);
  line-height: 1.45;
  word-break: keep-all;
  padding-right: 40px;
}

.book-body {
  padding: 0.875rem 1.1rem 1rem;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.book-author { font-size: 0.78rem; color: var(--text-muted); }
.book-pubdate { font-size: 0.7rem; color: #b0b0b0; margin-top: -3px; }
.book-date { font-size: 0.72rem; color: var(--green-mid); font-weight: 500; }
.book-divider { border: none; border-top: 1px solid var(--border); margin: 1px 0; }

.book-fav {
  font-size: 0.78rem;
  color: var(--text-secondary);
  line-height: 1.6;
  font-style: italic;
  padding-left: 9px;
  border-left: 2px solid var(--green-mid);
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.book-fav-img {
  width: 100%;
  border-radius: 6px;
  object-fit: cover;
  max-height: 110px;
}

.book-note {
  font-size: 0.72rem;
  color: var(--text-muted);
  line-height: 1.5;
  margin-top: auto;
}

.empty-state {
  text-align: center;
  padding: 5rem 2rem;
  color: var(--text-muted);
  grid-column: 1 / -1;
}

.empty-state p { font-size: 0.85rem; margin-top: 6px; }

.loading {
  text-align: center;
  padding: 4rem;
  color: var(--text-muted);
  grid-column: 1 / -1;
}

.spinner {
  width: 26px;
  height: 26px;
  border: 2px solid var(--border);
  border-top-color: var(--green-mid);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  margin: 0 auto 1rem;
}

@keyframes spin { to { transform: rotate(360deg); } }

.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(10,20,14,0.5);
  z-index: 200;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}

.modal-overlay.open { display: flex; }

.modal {
  background: var(--white);
  border-radius: 16px;
  padding: 2rem;
  width: 100%;
  max-width: 500px;
  max-height: 90vh;
  overflow-y: auto;
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.5rem;
}

.modal-title {
  font-family: 'Noto Serif KR', serif;
  font-size: 1.1rem;
  font-weight: 600;
}

.modal-close {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: none;
  cursor: pointer;
  font-size: 1rem;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: center;
}

.modal-close:hover { background: var(--bg); }

.form-group { margin-bottom: 1rem; }

.form-label {
  display: block;
  font-size: 0.8rem;
  font-weight: 500;
  color: var(--text-secondary);
  margin-bottom: 6px;
}

.form-input, .form-textarea {
  width: 100%;
  padding: 0.6rem 0.875rem;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 0.875rem;
  color: var(--text-primary);
  background: var(--white);
  font-family: inherit;
  outline: none;
  transition: border-color 0.15s;
}

.form-input:focus, .form-textarea:focus { border-color: var(--green-mid); }
.form-textarea { resize: vertical; min-height: 80px; }
.form-hint { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }

.form-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 1.5rem;
}

.btn {
  display: inline-flex;
  align-items: center;
  padding: 0.5rem 1rem;
  border-radius: 8px;
  font-size: 0.875rem;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--white);
  color: var(--text-primary);
  font-weight: 500;
  font-family: inherit;
  transition: all 0.15s;
}

.btn:hover { background: var(--bg); }
.btn-primary { background: var(--green-main); color: #fff; border-color: var(--green-main); }
.btn-primary:hover { background: var(--green-dark); }

.detail-modal {
  background: var(--white);
  border-radius: 16px;
  padding: 0;
  width: 100%;
  max-width: 480px;
  max-height: 90vh;
  overflow-y: auto;
  position: relative;
}

.detail-cover-area {
  display: flex;
  gap: 1.25rem;
  padding: 1.75rem 1.75rem 1.25rem;
  border-bottom: 1px solid var(--border);
}

.detail-cover-img {
  width: 72px;
  height: 100px;
  object-fit: cover;
  border-radius: 4px;
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}

.detail-cover-placeholder {
  width: 72px;
  height: 100px;
  background: var(--green-pale);
  border-radius: 4px;
  flex-shrink: 0;
}

.detail-info { flex: 1; }

.detail-title {
  font-family: 'Noto Serif KR', serif;
  font-size: 1.1rem;
  font-weight: 600;
  line-height: 1.4;
  color: var(--text-primary);
  margin-bottom: 6px;
}

.detail-author { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px; }
.detail-pubdate { font-size: 0.78rem; color: #b0b0b0; }

.detail-body { padding: 1.25rem 1.75rem 1.75rem; }

.detail-section-label {
  font-size: 0.7rem;
  font-weight: 600;
  color: var(--green-mid);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.detail-quote {
  font-size: 0.9rem;
  color: var(--text-secondary);
  line-height: 1.8;
  font-style: italic;
  padding-left: 12px;
  border-left: 2px solid var(--green-mid);
  white-space: pre-wrap;
}

.detail-note {
  font-size: 0.85rem;
  color: var(--text-secondary);
  line-height: 1.7;
  white-space: pre-wrap;
}

.detail-close {
  position: absolute;
  top: 1rem;
  right: 1rem;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--white);
  cursor: pointer;
  font-size: 0.9rem;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: center;
}

.detail-close:hover { background: var(--bg); }

.admin-login {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(10,20,14,0.5);
  z-index: 200;
  align-items: center;
  justify-content: center;
}

.admin-login.open { display: flex; }

.admin-box {
  background: var(--white);
  border-radius: 16px;
  padding: 2rem;
  width: 100%;
  max-width: 340px;
}

.admin-box h2 {
  font-family: 'Noto Serif KR', serif;
  font-size: 1rem;
  font-weight: 600;
  margin-bottom: 1.25rem;
}

.toast {
  position: fixed;
  bottom: 1.5rem;
  right: 1.5rem;
  background: var(--green-dark);
  color: #fff;
  padding: 0.75rem 1.25rem;
  border-radius: 10px;
  font-size: 0.875rem;
  opacity: 0;
  transform: translateY(8px);
  transition: all 0.2s;
  z-index: 300;
  pointer-events: none;
}

.toast.show { opacity: 1; transform: translateY(0); }

@media (max-width: 640px) {
  .hero { padding: 1.25rem 1rem; }
  main { padding: 1.25rem 1rem; }
  .books-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .hero-stats { gap: 1.25rem; }
  footer { padding: 0 1rem 1rem !important; }
}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-left">
    <div>
      <div class="hero-eyebrow">My Book Archive</div>
      <div class="hero-heading">독서 기록 <span style="font-size: 0.65em;">by 원쥬르</span></div>
    </div>
    <button class="btn-add" onclick="openAdminCheck()">+</button>
  </div>
  <div class="hero-stats">
    <div class="hero-stat">
      <span class="hero-stat-num" id="statRead">0</span><span class="hero-stat-unit">권</span>
    </div>
  </div>
</div>

<main>
  <div class="toolbar">
    <div class="toolbar-row">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input class="search-input" id="searchInput" type="text" placeholder="제목, 작가로 검색..." oninput="renderBooks()">
      </div>
    </div>
    <div class="sort-tabs">
      <span class="sort-tab active" id="sortAuthor" onclick="setSort('author')">작가순</span>
      <span class="sort-tab" id="sortTitle" onclick="setSort('title')">제목순</span>
    </div>
  </div>

  <div class="books-grid" id="booksGrid">
    <div class="loading"><div class="spinner"></div>불러오는 중...</div>
  </div>
</main>

<footer style="text-align:right; padding:0 2rem 1.25rem; font-size:0.7rem; color:var(--text-muted);">도서 이미지 제공 : 알라딘(www.aladin.co.kr)</footer>

<div style="background:#eef0ec; padding:10px 24px; text-align:center; border-top:1px solid var(--border);">
  <span style="font-size:0.7rem; color:#9a9a92;">Copyright 2026. 원쥬르. All rights reserved.</span>
</div>

<!-- DETAIL MODAL -->
<div class="modal-overlay" id="detailModal">
  <div class="detail-modal">
    <button class="detail-close" onclick="closeDetailModal()">✕</button>
    <div class="detail-cover-area">
      <div id="detailCoverWrap"></div>
      <div class="detail-info">
        <div class="detail-title" id="detailTitle"></div>
        <div class="detail-author" id="detailAuthor"></div>
        <div class="detail-pubdate" id="detailPubdate"></div>
      </div>
    </div>
    <div class="detail-body" id="detailBody"></div>
  </div>
</div>

<!-- ADD MODAL -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">책 추가하기</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="form-group">
      <label class="form-label">날짜</label>
      <input class="form-input" type="date" id="r_date">
    </div>
    <div class="form-group">
      <label class="form-label">제목 *</label>
      <input class="form-input" type="text" id="r_title" placeholder="책 제목">
    </div>
    <div class="form-group">
      <label class="form-label">작가 *</label>
      <input class="form-input" type="text" id="r_author" placeholder="저자명">
    </div>
    <div class="form-group">
      <label class="form-label">찜 (마음에 드는 구절)</label>
      <textarea class="form-textarea" id="r_fav" placeholder="마음에 드는 구절을 입력하세요"></textarea>
      <p class="form-hint">또는 이미지 URL을 입력해도 됩니다</p>
      <input class="form-input" type="text" id="r_fav_img" placeholder="이미지 URL (선택)" style="margin-top:6px">
    </div>
    <div class="form-group">
      <label class="form-label">비고</label>
      <textarea class="form-textarea" id="r_note" placeholder="메모"></textarea>
    </div>
    <div class="form-actions">
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn btn-primary" onclick="addBook()">저장</button>
    </div>
  </div>
</div>

<!-- ADMIN LOGIN -->
<div class="admin-login" id="adminLogin">
  <div class="admin-box">
    <h2>관리자 확인</h2>
    <div class="form-group">
      <label class="form-label">비밀번호</label>
      <input class="form-input" type="password" id="adminPw" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter')checkAdmin()">
    </div>
    <div class="form-actions">
      <button class="btn" onclick="document.getElementById('adminLogin').classList.remove('open')">취소</button>
      <button class="btn btn-primary" onclick="checkAdmin()">확인</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SHEET_ID = '15B6XdgWLHilGjL2f9x1i52FSKGeo3iu8zHiz2TKEA-I';
const API_KEY = 'AIzaSyAt8oijR53uJ_IgTbS4XRg9o9N4sNJhTkI';
const ADMIN_PASSWORD = 'bookarchive2024';
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbytav0XrOHjc4S4sEveuStfW8wFmDh3r-d6TPi37AqxWXdyx-klg_B-hvfl2tbHYDwl/exec';

let allReadBooks = [];
let isAdmin = false;
let currentSort = 'author';

function setSort(type) {
  currentSort = type;
  document.getElementById('sortAuthor').classList.toggle('active', type === 'author');
  document.getElementById('sortTitle').classList.toggle('active', type === 'title');
  renderBooks();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

async function fetchSheetData(sheetName) {
  const range = encodeURIComponent(sheetName + '!A:Z');
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${range}?key=${API_KEY}`;
  try {
    const res = await fetch(url);
    const data = await res.json();
    if (!data.values || data.values.length < 2) return [];
    const headers = data.values[0];
    return data.values.slice(1).map(row => {
      const obj = {};
      headers.forEach((h, i) => { obj[h] = row[i] || ''; });
      return obj;
    });
  } catch(e) { return []; }
}

async function loadData() {
  document.getElementById('booksGrid').innerHTML = '<div class="loading"><div class="spinner"></div>불러오는 중...</div>';
  allReadBooks = await fetchSheetData('읽은책');
  document.getElementById('statRead').textContent = allReadBooks.length;
  renderBooks();
}

function renderBooks() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();

  const filtered = allReadBooks.filter(b => {
    if (!q) return true;
    return (b['제목'] || '').toLowerCase().includes(q) || (b['작가'] || '').toLowerCase().includes(q);
  });

  filtered.sort((a, b) => {
    const authorA = (a['작가'] || '').trim();
    const authorB = (b['작가'] || '').trim();
    const titleA = (a['제목'] || '').trim();
    const titleB = (b['제목'] || '').trim();

    if (currentSort === 'title') {
      const titleCompare = titleA.localeCompare(titleB, 'ko');
      if (titleCompare !== 0) return titleCompare;
      return authorA.localeCompare(authorB, 'ko');
    } else {
      if (!authorA && !authorB) return titleA.localeCompare(titleB, 'ko');
      if (!authorA) return 1;
      if (!authorB) return -1;
      const authorCompare = authorA.localeCompare(authorB, 'ko');
      if (authorCompare !== 0) return authorCompare;
      return titleA.localeCompare(titleB, 'ko');
    }
  });

  const grid = document.getElementById('booksGrid');

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-state"><div style="font-size:2.5rem;opacity:0.3;margin-bottom:1rem">📚</div><div>${q ? '검색 결과가 없어요' : '아직 등록된 책이 없어요'}</div><p>+ 버튼으로 첫 번째 책을 기록해보세요</p></div>`;
    return;
  }

  grid.innerHTML = filtered.map(b => renderReadCard(b)).join('');
  loadCovers();
}

function renderReadCard(b) {
  const title = b['제목'] || '-';
  const idx = allReadBooks.indexOf(b);
  const hasFav = !!(b['찜'] || '').trim();
  const clickAttr = hasFav ? `onclick="openDetailModal(${idx})" style="cursor:pointer;"` : `style="cursor:default;"`;
  const favClass = hasFav ? 'has-fav' : '';
  return `
    <div class="book-card ${favClass}" ${clickAttr}>
      <div class="book-spine ${hasFav ? 'has-fav' : ''}"></div>
      <div class="book-cover">
        <div class="book-thumb" data-title="${escAttr(title)}" data-author="${escAttr(b['작가'] || '')}"></div>
        <div class="book-title">${esc(title)}</div>
      </div>
      <div class="book-body">
        <div class="book-author">${esc(b['작가'] || '-')}</div>
        <div class="book-pubdate"></div>
        ${b['날짜'] ? `<div class="book-date">${esc(b['날짜'])}</div>` : ''}
        ${b['비고'] ? `<div class="book-note">${esc(b['비고'])}</div>` : ''}
      </div>
    </div>`;
}

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function escAttr(str) {
  return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

const COVER_CACHE_PREFIX = 'bookinfo_v3_';

function getCachedCover(title) {
  try {
    const raw = localStorage.getItem(COVER_CACHE_PREFIX + title);
    return raw !== null ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}

function setCachedCover(title, info) {
  try { localStorage.setItem(COVER_CACHE_PREFIX + title, JSON.stringify(info)); } catch(e) {}
}

async function fetchCover(title, author) {
  const cached = getCachedCover(title);
  if (cached !== null) return cached;
  try {
    const res = await fetch(`${APPS_SCRIPT_URL}?action=cover&title=${encodeURIComponent(title)}&author=${encodeURIComponent(author || '')}`);
    const data = await res.json();
    if (data.status === 'ok') {
      const info = { cover: data.cover || '', pubDate: data.pubDate || '' };
      setCachedCover(title, info);
      return info;
    }
    return { cover: '', pubDate: '' };
  } catch(e) {
    return { cover: '', pubDate: '' };
  }
}

async function loadCovers() {
  const thumbs = Array.from(document.querySelectorAll('.book-thumb[data-title]'));
  const chunkSize = 5;
  for (let i = 0; i < thumbs.length; i += chunkSize) {
    const chunk = thumbs.slice(i, i + chunkSize);
    await Promise.all(chunk.map(async thumb => {
      const title = thumb.dataset.title;
      const author = thumb.dataset.author || '';
      const info = await fetchCover(title, author);
      if (info.cover) {
        thumb.style.backgroundImage = `url('${info.cover}')`;
        thumb.classList.add('has-cover');
      }
      if (info.pubDate) {
        const card = thumb.closest('.book-card');
        const pubEl = card ? card.querySelector('.book-pubdate') : null;
        if (pubEl) pubEl.textContent = info.pubDate.split('-')[0];
      }
    }));
  }
}

function openDetailModal(idx) {
  const b = allReadBooks[idx];
  if (!b) return;
  const title = b['제목'] || '-';
  const fav = b['찜'] || '';
  const note = b['비고'] || '';
  const isImg = fav && (/\.(jpg|jpeg|png|gif|webp|svg)/i.test(fav) || fav.startsWith('http'));

  document.getElementById('detailTitle').textContent = title;
  document.getElementById('detailAuthor').textContent = b['작가'] || '-';

  const cached = getCachedCover(title);
  const coverWrap = document.getElementById('detailCoverWrap');
  const pubdateEl = document.getElementById('detailPubdate');

  if (cached && cached.cover) {
    coverWrap.innerHTML = `<img class="detail-cover-img" src="${esc(cached.cover)}" alt="표지" onerror="this.style.display='none'">`;
  } else {
    coverWrap.innerHTML = `<div class="detail-cover-placeholder"></div>`;
  }

  pubdateEl.textContent = (cached && cached.pubDate) ? cached.pubDate.split('-')[0] : '';

  let bodyHTML = '';
  if (fav) {
    bodyHTML += `<div class="detail-section-label">접어둔 페이지</div>`;
    if (isImg) {
      bodyHTML += `<img src="${esc(fav)}" style="width:100%;border-radius:8px;margin-bottom:1rem;" onerror="this.style.display='none'">`;
    } else {
      bodyHTML += `<div class="detail-quote">${esc(fav)}</div>`;
    }
  }
  if (note) {
    bodyHTML += `<div style="margin-top:1.25rem;"><div class="detail-section-label">비고</div><div class="detail-note">${esc(note)}</div></div>`;
  }
  if (!fav && !note) {
    bodyHTML = `<div style="color:var(--text-muted);font-size:0.85rem;text-align:center;padding:1rem 0;">아직 기록된 내용이 없어요</div>`;
  }

  document.getElementById('detailBody').innerHTML = bodyHTML;
  document.getElementById('detailModal').classList.add('open');
}

function closeDetailModal() {
  document.getElementById('detailModal').classList.remove('open');
}

function openAdminCheck() {
  if (isAdmin) { openModal(); return; }
  document.getElementById('adminPw').value = '';
  document.getElementById('adminLogin').classList.add('open');
  setTimeout(() => document.getElementById('adminPw').focus(), 100);
}

function checkAdmin() {
  if (document.getElementById('adminPw').value === ADMIN_PASSWORD) {
    isAdmin = true;
    document.getElementById('adminLogin').classList.remove('open');
    openModal();
  } else {
    showToast('비밀번호가 틀렸어요');
  }
}

function openModal() {
  document.getElementById('addModal').classList.add('open');
}

function closeModal() {
  document.getElementById('addModal').classList.remove('open');
  ['r_date','r_title','r_author','r_fav','r_fav_img','r_note']
    .forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
}

async function addBook() {
  const title = document.getElementById('r_title').value.trim();
  const author = document.getElementById('r_author').value.trim();
  if (!title || !author) { showToast('제목과 작가는 필수예요'); return; }
  const fav = document.getElementById('r_fav_img').value.trim() || document.getElementById('r_fav').value.trim();
  const rowData = {
    sheet: '읽은책',
    values: [document.getElementById('r_date').value, title, author, fav, document.getElementById('r_note').value.trim()]
  };

  try {
    const res = await fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify(rowData) });
    const result = await res.json();
    if (result.status === 'ok') {
      showToast('✅ 저장됐어요!');
      closeModal();
      await loadData();
    } else {
      showToast('저장 실패: ' + result.message);
    }
  } catch(e) { showToast('오류가 발생했어요'); }
}

document.getElementById('detailModal').addEventListener('click', e => { if (e.target === document.getElementById('detailModal')) closeDetailModal(); });
document.getElementById('addModal').addEventListener('click', e => { if (e.target === document.getElementById('addModal')) closeModal(); });
document.getElementById('adminLogin').addEventListener('click', e => { if (e.target === document.getElementById('adminLogin')) document.getElementById('adminLogin').classList.remove('open'); });

loadData();
</script>
</body>
</html>
