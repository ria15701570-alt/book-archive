<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 책 보관함</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❤️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --green-dark:   #1a3a2a;
  --green-main:   #2d5a3d;
  --green-mid:    #3d7a52;
  --green-light:  #e8f2ec;
  --green-pale:   #f3f8f5;
  --white:        #ffffff;
  --text-primary: #1a1a1a;
  --text-secondary: #4a4a4a;
  --text-muted:   #8a8a8a;
  --border:       #e2e8e4;
  --border-hover: #b8cfc0;
  --bg:           #f7f9f7;
}

body {
  font-family: 'Noto Sans KR', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  min-height: 100vh;
}

nav {
  background: var(--green-dark);
  padding: 0 2.5rem;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}

.nav-logo {
  font-family: 'Noto Serif KR', serif;
  font-size: 1.1rem;
  font-weight: 600;
  color: #fff;
  letter-spacing: 0.5px;
}

.nav-logo span { color: #7ec89a; margin-right: 8px; }

.nav-tabs { display: flex; height: 100%; }

.nav-tab {
  display: flex;
  align-items: center;
  padding: 0 1.25rem;
  font-size: 0.875rem;
  color: rgba(255,255,255,0.5);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.15s;
}

.nav-tab:hover { color: rgba(255,255,255,0.85); }
.nav-tab.active { color: #fff; border-bottom-color: #7ec89a; }

.btn-add {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0.5rem 1.1rem;
  background: var(--green-mid);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 0.875rem;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s;
  font-family: inherit;
}

.btn-add:hover { background: #4d9a67; }

.hero {
  background: var(--green-main);
  padding: 1.75rem 2.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  flex-wrap: wrap;
}

.hero-eyebrow {
  font-size: 0.7rem;
  color: rgba(255,255,255,0.5);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 2px;
}

.hero-heading {
  font-family: 'Noto Serif KR', serif;
  font-size: 1.3rem;
  font-weight: 600;
  color: #fff;
}

.hero-stats { display: flex; gap: 2rem; }

.hero-stat-num {
  font-family: 'Noto Serif KR', serif;
  font-size: 2rem;
  font-weight: 600;
  color: #fff;
  line-height: 1;
}

.hero-stat-label {
  font-size: 0.72rem;
  color: rgba(255,255,255,0.5);
  margin-top: 4px;
}

main { max-width: 1200px; margin: 0 auto; padding: 2rem; }

.toolbar {
  display: flex;
  gap: 10px;
  margin-bottom: 1.75rem;
  flex-wrap: wrap;
}

.search-wrap { position: relative; flex: 1; min-width: 200px; }

.search-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 13px;
  pointer-events: none;
}

.search-input {
  width: 100%;
  padding: 0.65rem 1rem 0.65rem 2.6rem;
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 0.875rem;
  background: var(--white);
  color: var(--text-primary);
  outline: none;
  transition: border-color 0.15s;
  font-family: inherit;
}

.search-input:focus { border-color: var(--green-mid); }
.search-input::placeholder { color: var(--text-muted); }

select.filter-select {
  padding: 0.65rem 1rem;
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 0.875rem;
  background: var(--white);
  color: var(--text-primary);
  outline: none;
  cursor: pointer;
  min-width: 110px;
  font-family: inherit;
}

.books-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
  gap: 18px;
}

.book-card {
  background: var(--white);
  border-radius: 10px;
  border: 1px solid var(--border);
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s;
  display: flex;
  flex-direction: column;
}

.book-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 28px rgba(45,90,61,0.11);
  border-color: var(--border-hover);
}

.book-spine { height: 5px; flex-shrink: 0; background: var(--green-main); }
.book-spine.wish { background: #6b9e7e; }

.book-cover {
  background: var(--green-pale);
  padding: 1.25rem 1.1rem 1rem;
  flex-shrink: 0;
  min-height: 130px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  position: relative;
}

.book-cover-icon {
  position: absolute;
  top: 0.9rem;
  right: 0.9rem;
  font-size: 1.4rem;
  opacity: 0.15;
}

.book-badge {
  display: inline-block;
  font-size: 0.62rem;
  padding: 2px 7px;
  border-radius: 20px;
  font-weight: 500;
  margin-bottom: 7px;
  width: fit-content;
  letter-spacing: 0.2px;
}

.badge-read { background: var(--green-light); color: var(--green-dark); }
.badge-wish { background: #dceee3; color: #2a5c3a; }

.book-title {
  font-family: 'Noto Serif KR', serif;
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--text-primary);
  line-height: 1.45;
  word-break: keep-all;
}

.book-body {
  padding: 0.875rem 1.1rem 1rem;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.book-author { font-size: 0.78rem; color: var(--text-muted); }
.book-date { font-size: 0.72rem; color: var(--green-mid); font-weight: 500; }

.book-divider { border: none; border-top: 1px solid var(--border); margin: 1px 0; }

.book-fav {
  font-size: 0.78rem;
  color: var(--text-secondary);
  line-height: 1.6;
  font-style: italic;
  padding-left: 9px;
  border-left: 2px solid var(--green-mid);
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.book-fav-img {
  width: 100%;
  border-radius: 6px;
  object-fit: cover;
  max-height: 110px;
}

.book-feature {
  font-size: 0.78rem;
  color: var(--text-secondary);
  line-height: 1.6;
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.book-note {
  font-size: 0.72rem;
  color: var(--text-muted);
  line-height: 1.5;
  margin-top: auto;
}

.empty-state {
  text-align: center;
  padding: 5rem 2rem;
  color: var(--text-muted);
  grid-column: 1 / -1;
}

.empty-state p { font-size: 0.85rem; margin-top: 6px; }

.loading {
  text-align: center;
  padding: 4rem;
  color: var(--text-muted);
  grid-column: 1 / -1;
}

.spinner {
  width: 26px;
  height: 26px;
  border: 2px solid var(--border);
  border-top-color: var(--green-mid);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  margin: 0 auto 1rem;
}

@keyframes spin { to { transform: rotate(360deg); } }

.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(10,20,14,0.5);
  z-index: 200;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}

.modal-overlay.open { display: flex; }

.modal {
  background: var(--white);
  border-radius: 16px;
  padding: 2rem;
  width: 100%;
  max-width: 500px;
  max-height: 90vh;
  overflow-y: auto;
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.5rem;
}

.modal-title {
  font-family: 'Noto Serif KR', serif;
  font-size: 1.1rem;
  font-weight: 600;
}

.modal-close {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: none;
  cursor: pointer;
  font-size: 1rem;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: center;
}

.modal-close:hover { background: var(--bg); }

.modal-tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  margin-bottom: 1.5rem;
}

.modal-tab {
  padding: 0.5rem 1rem;
  font-size: 0.875rem;
  color: var(--text-muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  font-family: inherit;
}

.modal-tab:hover { color: var(--text-primary); }
.modal-tab.active { color: var(--green-main); border-bottom-color: var(--green-main); }

.form-group { margin-bottom: 1rem; }

.form-label {
  display: block;
  font-size: 0.8rem;
  font-weight: 500;
  color: var(--text-secondary);
  margin-bottom: 6px;
}

.form-input, .form-textarea {
  width: 100%;
  padding: 0.6rem 0.875rem;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 0.875rem;
  color: var(--text-primary);
  background: var(--white);
  font-family: inherit;
  outline: none;
  transition: border-color 0.15s;
}

.form-input:focus, .form-textarea:focus { border-color: var(--green-mid); }
.form-textarea { resize: vertical; min-height: 80px; }
.form-hint { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }

.form-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 1.5rem;
}

.btn {
  display: inline-flex;
  align-items: center;
  padding: 0.5rem 1rem;
  border-radius: 8px;
  font-size: 0.875rem;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--white);
  color: var(--text-primary);
  font-weight: 500;
  font-family: inherit;
  transition: all 0.15s;
}

.btn:hover { background: var(--bg); }
.btn-primary { background: var(--green-main); color: #fff; border-color: var(--green-main); }
.btn-primary:hover { background: var(--green-dark); }

.admin-login {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(10,20,14,0.5);
  z-index: 200;
  align-items: center;
  justify-content: center;
}

.admin-login.open { display: flex; }

.admin-box {
  background: var(--white);
  border-radius: 16px;
  padding: 2rem;
  width: 100%;
  max-width: 340px;
}

.admin-box h2 {
  font-family: 'Noto Serif KR', serif;
  font-size: 1rem;
  font-weight: 600;
  margin-bottom: 1.25rem;
}

.toast {
  position: fixed;
  bottom: 1.5rem;
  right: 1.5rem;
  background: var(--green-dark);
  color: #fff;
  padding: 0.75rem 1.25rem;
  border-radius: 10px;
  font-size: 0.875rem;
  opacity: 0;
  transform: translateY(8px);
  transition: all 0.2s;
  z-index: 300;
  pointer-events: none;
}

.toast.show { opacity: 1; transform: translateY(0); }

@media (max-width: 640px) {
  nav { padding: 0 1rem; }
  .hero { padding: 1.25rem 1rem; }
  main { padding: 1.25rem 1rem; }
  .books-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .hero-stats { gap: 1.25rem; }
}
</style>
</head>
<body>

<nav>
  <span class="nav-logo"><span>🔖</span>원쥬르봉쥬르쥬르쥬르</span>
  <div class="nav-tabs">
    <div class="nav-tab active" onclick="switchTab('read')">읽은 책</div>
    <div class="nav-tab" onclick="switchTab('wish')">읽을 책</div>
  </div>
  <button class="btn-add" onclick="openAdminCheck()">+ 더하기</button>
</nav>

<div class="hero">
  <div>
    <div class="hero-eyebrow">My Book Archive</div>
    <div class="hero-heading">내 책 보관함</div>
  </div>
  <div class="hero-stats">
    <div class="hero-stat">
      <div class="hero-stat-num" id="statRead">0</div>
      <div class="hero-stat-label">읽은 책</div>
    </div>
    <div class="hero-stat">
      <div class="hero-stat-num" id="statWish">0</div>
      <div class="hero-stat-label">읽을 책</div>
    </div>
    <div class="hero-stat">
      <div class="hero-stat-num" id="statTotal">0</div>
      <div class="hero-stat-label">전체</div>
    </div>
  </div>
</div>

<main>
  <div class="toolbar">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input class="search-input" id="searchInput" type="text" placeholder="제목, 작가로 검색..." oninput="renderBooks()">
    </div>
    <select class="filter-select" id="filterField" onchange="renderBooks()">
      <option value="all">전체</option>
      <option value="title">제목</option>
      <option value="author">작가</option>
    </select>
  </div>

  <div class="books-grid" id="booksGrid">
    <div class="loading"><div class="spinner"></div>불러오는 중...</div>
  </div>
</main>

<!-- ADD MODAL -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">책 추가하기</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-tabs">
      <div class="modal-tab active" onclick="switchFormTab('read')">읽은 책</div>
      <div class="modal-tab" onclick="switchFormTab('wish')">읽을 책</div>
    </div>
    <div id="formRead">
      <div class="form-group">
        <label class="form-label">날짜</label>
        <input class="form-input" type="date" id="r_date">
      </div>
      <div class="form-group">
        <label class="form-label">제목 *</label>
        <input class="form-input" type="text" id="r_title" placeholder="책 제목">
      </div>
      <div class="form-group">
        <label class="form-label">작가 *</label>
        <input class="form-input" type="text" id="r_author" placeholder="저자명">
      </div>
      <div class="form-group">
        <label class="form-label">찜 (마음에 드는 구절)</label>
        <textarea class="form-textarea" id="r_fav" placeholder="마음에 드는 구절을 입력하세요"></textarea>
        <p class="form-hint">또는 이미지 URL을 입력해도 됩니다</p>
        <input class="form-input" type="text" id="r_fav_img" placeholder="이미지 URL (선택)" style="margin-top:6px">
      </div>
      <div class="form-group">
        <label class="form-label">비고</label>
        <textarea class="form-textarea" id="r_note" placeholder="메모"></textarea>
      </div>
      <div class="form-actions">
        <button class="btn" onclick="closeModal()">취소</button>
        <button class="btn btn-primary" onclick="addBook('read')">저장</button>
      </div>
    </div>
    <div id="formWish" style="display:none">
      <div class="form-group">
        <label class="form-label">제목 *</label>
        <input class="form-input" type="text" id="w_title" placeholder="책 제목">
      </div>
      <div class="form-group">
        <label class="form-label">작가 *</label>
        <input class="form-input" type="text" id="w_author" placeholder="저자명">
      </div>
      <div class="form-group">
        <label class="form-label">특징</label>
        <textarea class="form-textarea" id="w_feature" placeholder="책의 특징이나 추천 이유"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">비고</label>
        <textarea class="form-textarea" id="w_note" placeholder="메모"></textarea>
      </div>
      <div class="form-actions">
        <button class="btn" onclick="closeModal()">취소</button>
        <button class="btn btn-primary" onclick="addBook('wish')">저장</button>
      </div>
    </div>
  </div>
</div>

<!-- ADMIN LOGIN -->
<div class="admin-login" id="adminLogin">
  <div class="admin-box">
    <h2>관리자 확인</h2>
    <div class="form-group">
      <label class="form-label">비밀번호</label>
      <input class="form-input" type="password" id="adminPw" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter')checkAdmin()">
    </div>
    <div class="form-actions">
      <button class="btn" onclick="document.getElementById('adminLogin').classList.remove('open')">취소</button>
      <button class="btn btn-primary" onclick="checkAdmin()">확인</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SHEET_ID = '15B6XdgWLHilGjL2f9x1i52FSKGeo3iu8zHiz2TKEA-I';
const API_KEY = 'AIzaSyAt8oijR53uJ_IgTbS4XRg9o9N4sNJhTkI';
const ADMIN_PASSWORD = 'bookarchive2024';
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwxnQ4Gvl1UpWx7apJByroBqKS2JLsf44y4l68Q7qXnsrtjfJHqmMBHl5IwArHaEGHj/exec';

let currentTab = 'read';
let allReadBooks = [];
let allWishBooks = [];
let isAdmin = false;

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

async function fetchSheetData(sheetName) {
  const range = encodeURIComponent(sheetName + '!A:Z');
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${range}?key=${API_KEY}`;
  try {
    const res = await fetch(url);
    const data = await res.json();
    if (!data.values || data.values.length < 2) return [];
    const headers = data.values[0];
    return data.values.slice(1).map(row => {
      const obj = {};
      headers.forEach((h, i) => { obj[h] = row[i] || ''; });
      return obj;
    });
  } catch(e) { return []; }
}

async function loadData() {
  document.getElementById('booksGrid').innerHTML = '<div class="loading"><div class="spinner"></div>불러오는 중...</div>';
  allReadBooks = await fetchSheetData('읽은책');
  allWishBooks = await fetchSheetData('읽을책');
  document.getElementById('statRead').textContent = allReadBooks.length;
  document.getElementById('statWish').textContent = allWishBooks.length;
  document.getElementById('statTotal').textContent = allReadBooks.length + allWishBooks.length;
  renderBooks();
}

function renderBooks() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const field = document.getElementById('filterField').value;
  const books = currentTab === 'read' ? allReadBooks : allWishBooks;

  const filtered = books.filter(b => {
    if (!q) return true;
    if (field === 'title') return (b['제목'] || '').toLowerCase().includes(q);
    if (field === 'author') return (b['작가'] || '').toLowerCase().includes(q);
    return Object.values(b).some(v => v.toLowerCase().includes(q));
  });

  const grid = document.getElementById('booksGrid');

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-state"><div style="font-size:2.5rem;opacity:0.3;margin-bottom:1rem">📚</div><div>${q ? '검색 결과가 없어요' : '아직 등록된 책이 없어요'}</div><p>+ 추가 버튼으로 첫 번째 책을 기록해보세요</p></div>`;
    return;
  }

  grid.innerHTML = filtered.map(b => currentTab === 'read' ? renderReadCard(b) : renderWishCard(b)).join('');
}

function renderReadCard(b) {
  const fav = b['찜'] || '';
  const isImg = fav && (/\.(jpg|jpeg|png|gif|webp|svg)/i.test(fav) || fav.startsWith('http'));
  return `
    <div class="book-card">
      <div class="book-spine"></div>
      <div class="book-cover">
        <div class="book-cover-icon">📖</div>
        <span class="book-badge badge-read">읽음</span>
        <div class="book-title">${esc(b['제목'] || '-')}</div>
      </div>
      <div class="book-body">
        <div class="book-author">${esc(b['작가'] || '-')}</div>
        ${b['날짜'] ? `<div class="book-date">${esc(b['날짜'])}</div>` : ''}
        ${fav ? `<hr class="book-divider">${isImg
          ? `<img class="book-fav-img" src="${esc(fav)}" alt="찜" onerror="this.style.display='none'">`
          : `<div class="book-fav">${esc(fav)}</div>`}` : ''}
        ${b['비고'] ? `<div class="book-note">${esc(b['비고'])}</div>` : ''}
      </div>
    </div>`;
}

function renderWishCard(b) {
  return `
    <div class="book-card">
      <div class="book-spine wish"></div>
      <div class="book-cover">
        <div class="book-cover-icon">🔖</div>
        <span class="book-badge badge-wish">읽을 예정</span>
        <div class="book-title">${esc(b['제목'] || '-')}</div>
      </div>
      <div class="book-body">
        <div class="book-author">${esc(b['작가'] || '-')}</div>
        ${b['특징'] ? `<hr class="book-divider"><div class="book-feature">${esc(b['특징'])}</div>` : ''}
        ${b['비고'] ? `<div class="book-note">${esc(b['비고'])}</div>` : ''}
      </div>
    </div>`;
}

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.nav-tab').forEach((el, i) => {
    el.classList.toggle('active', (i === 0 && tab === 'read') || (i === 1 && tab === 'wish'));
  });
  document.getElementById('searchInput').value = '';
  renderBooks();
}

function switchFormTab(tab) {
  document.querySelectorAll('.modal-tab').forEach((el, i) => {
    el.classList.toggle('active', (i === 0 && tab === 'read') || (i === 1 && tab === 'wish'));
  });
  document.getElementById('formRead').style.display = tab === 'read' ? '' : 'none';
  document.getElementById('formWish').style.display = tab === 'wish' ? '' : 'none';
}

function openAdminCheck() {
  if (isAdmin) { openModal(); return; }
  document.getElementById('adminPw').value = '';
  document.getElementById('adminLogin').classList.add('open');
  setTimeout(() => document.getElementById('adminPw').focus(), 100);
}

function checkAdmin() {
  if (document.getElementById('adminPw').value === ADMIN_PASSWORD) {
    isAdmin = true;
    document.getElementById('adminLogin').classList.remove('open');
    openModal();
  } else {
    showToast('비밀번호가 틀렸어요');
  }
}

function openModal() {
  document.getElementById('addModal').classList.add('open');
  switchFormTab(currentTab);
}

function closeModal() {
  document.getElementById('addModal').classList.remove('open');
  ['r_date','r_title','r_author','r_fav','r_fav_img','r_note','w_title','w_author','w_feature','w_note']
    .forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
}

async function addBook(type) {
  let rowData;
  if (type === 'read') {
    const title = document.getElementById('r_title').value.trim();
    const author = document.getElementById('r_author').value.trim();
    if (!title || !author) { showToast('제목과 작가는 필수예요'); return; }
    const fav = document.getElementById('r_fav_img').value.trim() || document.getElementById('r_fav').value.trim();
    rowData = { sheet: '읽은책', values: [document.getElementById('r_date').value, title, author, fav, document.getElementById('r_note').value.trim()] };
  } else {
    const title = document.getElementById('w_title').value.trim();
    const author = document.getElementById('w_author').value.trim();
    if (!title || !author) { showToast('제목과 작가는 필수예요'); return; }
    rowData = { sheet: '읽을책', values: [title, author, document.getElementById('w_feature').value.trim(), document.getElementById('w_note').value.trim()] };
  }

  try {
    const res = await fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify(rowData) });
    const result = await res.json();
    if (result.status === 'ok') {
      showToast('✅ 저장됐어요!');
      closeModal();
      await loadData();
    } else {
      showToast('저장 실패: ' + result.message);
    }
  } catch(e) { showToast('오류가 발생했어요'); }
}

document.getElementById('addModal').addEventListener('click', e => { if (e.target === document.getElementById('addModal')) closeModal(); });
document.getElementById('adminLogin').addEventListener('click', e => { if (e.target === document.getElementById('adminLogin')) document.getElementById('adminLogin').classList.remove('open'); });

loadData();
</script>
</body>
</html>
